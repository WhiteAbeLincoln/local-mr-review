[project]
name = "mr-review"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["click>=8.1", "pyyaml>=6.0"]

[project.scripts]
mr-review = "mr_review.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mr_review"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes (unused/undefined), I import sorting,
# UP pyupgrade (catches needless quoted annotations like "str | None").
# E501 (line length) is left to the formatter, not a lint failure.
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]
