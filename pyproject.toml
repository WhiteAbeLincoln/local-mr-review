[project]
name = "mr-review"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["click>=8.5.0", "pyyaml>=6.0"]

[project.scripts]
mr-review = "mr_review.cli:main"

[dependency-groups]
dev = [
    "prek>=0.5.1",
    "pyrefly>=1.2.0",
    "pytest>=8.0",
    "ruff>=0.16.5",
]

[build-system]
requires = ["uv_build>=0.12.8,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes (unused/undefined), I import sorting,
# UP pyupgrade (catches needless quoted annotations like "str | None").
# E501 (line length) is left to the formatter, not a lint failure.
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.pyrefly]
python-version = "3.14"
# Only our code; skip the venv and generated trees.
project-includes = ["src", "tests"]
# Import roots, mirroring pytest's pythonpath: "src" resolves the mr_review
# package, "." resolves the tests package (e.g. `from tests.fakes import ...`).
search-path = ["src", "."]
