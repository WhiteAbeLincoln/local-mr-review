version: 2
updates:
  # Python deps via uv (bumps uv.lock + pyproject.toml). GA since 2025-03.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]

  # Keep the workflow action pins current (checkout, nix-installer, cache).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

# Note: Nix flake inputs are not covered by Dependabot; update them with
# `nix flake update` as needed.
